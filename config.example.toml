# Add to /etc/pwnagotchi/config.toml on the pwnagotchi, then restart
# the pwnagotchi service. The token must match the one install.ps1
# generated on the PC (also saved in %USERPROFILE%\hashcat-bridge\token.txt).

main.plugins.pwn2pot.enabled = true
main.plugins.pwn2pot.host_url = "http://10.0.0.1:8765/submit"
main.plugins.pwn2pot.token = "PASTE_TOKEN_FROM_INSTALL"
main.plugins.pwn2pot.hcxpcapngtool = "/usr/local/bin/hcxpcapngtool"
